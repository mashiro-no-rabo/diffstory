<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
{{CSS}}
</style>
</head>
<body>
<header class="appbar">
  <a class="wordmark" href="#top">Diffstory</a>
  {{PROGRESS}}
  <div class="top-actions">
    <div class="view-switch" role="group" aria-label="Diff layout">
      <button type="button" id="inline-mode" aria-pressed="true">Inline</button>
      <button type="button" id="split-mode" aria-pressed="false">Split</button>
    </div>
    <button type="button" id="theme-toggle" class="quiet" aria-label="Toggle color theme">Theme</button>
    <button type="button" id="comments-toggle" aria-expanded="false" aria-controls="comments-drawer">Comments <span class="count" id="comment-count">0</span></button>
    <button type="button" id="outline-toggle" class="mobile-outline" aria-expanded="false" aria-controls="sidebar">Outline</button>
  </div>
</header>
<nav class="sidebar" id="sidebar" aria-label="Story outline">
  <div class="outline-label">STORY OUTLINE</div>
  <ul class="toc" id="toc">
    {{TOC}}
  </ul>
  <div class="sidebar-footer">Select text, then type to comment<br><kbd>j</kbd> <kbd>k</kbd> Navigate sections</div>
</nav>
<div id="top"></div>
<main class="content">
  <section class="story-intro" id="overview">
    <header class="page-header">
      <h1>{{HEADER_TITLE}}</h1>
      {{HEADER_AUTHOR}}
    </header>
    {{DESCRIPTION}}
  </section>
  {{GROUPS}}
  {{UNCATEGORIZED}}
</main>
<aside id="comments-drawer" class="comments-drawer" aria-label="All comments" data-pr-url="{{PR_URL}}" data-render-id="{{RENDER_ID}}" hidden>
  <header class="drawer-header">
    <h2>Comments <span class="count" id="drawer-count">0</span></h2>
    <button type="button" class="quiet" id="close-comments" aria-label="Close comments">Close</button>
  </header>
  <div class="drawer-filter">
    <label for="comment-filter">Show</label>
    <select id="comment-filter">
      <option value="all">All sections</option>
      <option value="current">Current section</option>
    </select>
  </div>
  <div id="all-comments" class="all-comments"></div>
  <footer class="drawer-footer">
    <button type="button" id="clear-comments" class="quiet">Clear</button>
    <button type="button" id="copy-comments" class="primary">Copy prompt</button>
  </footer>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="comment-editor">
  <form method="dialog">
    <h2 id="editor-heading">Add comment</h2>
    <p id="editor-location"></p>
    <pre id="editor-quote"></pre>
    <label for="comment-body">Your comment</label>
    <textarea id="comment-body" required placeholder="What would you like to change?" rows="4"></textarea>
    <div class="editor-actions">
      <button value="cancel" formnovalidate>Cancel</button>
      <button id="save-comment" value="save" class="primary">Save comment</button>
    </div>
  </form>
</dialog>
<script>
{{JS}}
</script>
</body>
</html>
